# =====================================================================
# Microservice Performance Simulation Workbench
# Component parameter schema v0.1 (first batch: traffic source + 6 components + call edge)
# =====================================================================
#
# Conventions
#   - Time units are a field-name suffix: *_ms milliseconds, *_s seconds
#   - Rates: rps (requests per second), mps (messages per second)
#   - Ratios: 0.0 to 1.0
#   - default: default value; range: allowed range; calibrate: real metric it can be bound to (PromQL / OTel)
#   - primitives: the behavior primitives the component is composed of (basis for the engine implementation)
#
# Behavior primitives (the engine implements only these 7)
#   ServerPool    c workers + bounded queue, M/G/c/K
#   Delay         pure delay, holds no resource
#   Router        split by probability / rules
#   ResourcePool  connection pool / semaphore: acquire-release, wait with timeout
#   RateLimiter   token bucket: reject or queue when over the limit
#   StateMachine  circuit breaker / autoscaling / failover
#   Buffer        asynchronous queue, backlog = ∫(λ_in − μ_out)dt
# =====================================================================

schema_version: "0.1"

# ---------------------------------------------------------------------
# 1. Common types
# ---------------------------------------------------------------------
types:

  # Distribution: used for service times, latencies and the like
  Distribution:
    oneOf:
      - { dist: constant,    value_ms: number }
      - { dist: exponential, mean_ms: number }
      - { dist: lognormal,   median_ms: number, p99_ms: number }   # recommended default: intuitive, long-tailed
      - { dist: normal,      mean_ms: number, stddev_ms: number }  # truncated at ≥ 0
      - { dist: mixture,     components: [ { weight: number, of: Distribution } ] }  # bimodal: cache hit/miss, slow queries
      - { dist: empirical,   source: string }                      # histogram imported from OTel spans
    note: "lognormal derives μ and σ from median + p99: σ = ln(p99/median) / 2.326"

  # Fault injection: each component declares the fault types it supports
  FailureInjection:
    fields:
      type:       { type: string, desc: "component-specific fault name, see each component's failures" }
      at_s:       { type: number, desc: "seconds after the simulation starts" }
      duration_s: { type: number, desc: "duration; null means it never ends" }
      recovery:   { type: enum, values: [instant, linear], default: instant, desc: "recover instantly or linearly after the fault ends" }
      recovery_s: { type: number, default: 0 }
      params:     { type: object, desc: "fault parameters, e.g. multiplier, ratio" }

  # Autoscaling (a property of services / gateways; may become its own component in a later batch)
  Autoscale:
    fields:
      enabled:                { type: bool,   default: false }
      metric:                 { type: enum,   values: [cpu, concurrency, rps], default: cpu }
      target:                 { type: number, default: 0.6, desc: "cpu: utilization; concurrency: in-flight per instance; rps: rps per instance" }
      min_instances:          { type: int,    default: 2 }
      max_instances:          { type: int,    default: 20 }
      sync_period_s:          { type: number, default: 15,  desc: "metric collection + decision period (K8s HPA default is 15s)" }
      scale_up_stabilization_s:   { type: number, default: 0 }
      scale_down_stabilization_s: { type: number, default: 300 }
      cold_start_s:           { type: number, default: 30,  desc: "time from creating an instance until it takes traffic" }
      warmup_s:               { type: number, default: 0,   desc: "performance ramp after taking traffic (JIT, connection warm-up)" }
    formula: "desired = ceil(current × metric / target), clamped to [min, max]"

  # Instance pool: shared by services and gateways
  InstancePool:
    fields:
      instances:            { type: int, default: 3, range: [1, 1000] }
      workers_per_instance: { type: int, default: 50, desc: "thread pool / concurrency limit c" }
      queue_capacity:       { type: int, default: 100, desc: "per-instance wait queue limit K−c; reject (503) when full" }
      queue_timeout_ms:     { type: number, default: null, desc: "drop requests that wait longer than this (load shedding); null disables it" }
      cpu_cores:            { type: number, default: 2, desc: "CPU limit; together with workers it determines CPU throttling" }
      cpu_fraction:         { type: number, default: 0.7, desc: "share of service time actually on CPU; the rest waits on I/O" }

# ---------------------------------------------------------------------
# 2. Call edge: timeouts, retries, circuit breakers and connection pools live here
# ---------------------------------------------------------------------
edge:
  primitives: [Delay, ResourcePool, StateMachine]
  fields:
    from:            { type: ref, required: true }
    to:              { type: ref, required: true }
    endpoint:        { type: string, default: "*", desc: "which upstream handler this edge belongs to" }
    mode:            { type: enum, values: [sync, async], default: sync }
    calls_per_request: { type: number, default: 1, desc: "V in the forced flow law; may be fractional (probabilistic calls)" }
    probability:     { type: number, default: 1.0, desc: "probability that this call happens (conditional call)" }
    parallel_group:  { type: string, default: null, desc: "edges in the same group are sent in parallel; completion is the max (fan-out)" }
    order:           { type: int, default: 0, desc: "sequential order within one handler" }
    network_latency: { type: Distribution, default: { dist: lognormal, median_ms: 0.5, p99_ms: 3 } }

    timeout_ms:      { type: number, default: 1000, desc: "per-attempt timeout" }
    total_deadline_ms: { type: number, default: null, desc: "overall deadline including retries; recommended so retries cannot stack up" }

    retry:
      max_attempts:     { type: int, default: 1, desc: "1 means no retries; 3 means up to 2 retries" }
      retry_on:         { type: list, values: [timeout, 5xx, 429, connection_error], default: [timeout, 5xx] }
      backoff:          { type: enum, values: [none, fixed, exponential], default: exponential }
      base_delay_ms:    { type: number, default: 100 }
      max_delay_ms:     { type: number, default: 2000 }
      jitter:           { type: enum, values: [none, full, equal], default: full }
      retry_budget_ratio: { type: number, default: null, desc: "retries may not exceed this share of normal requests (e.g. 0.1); null means unlimited" }

    circuit_breaker:
      enabled:              { type: bool,   default: false }
      failure_rate_threshold: { type: number, default: 0.5 }
      slow_call_threshold_ms: { type: number, default: null, desc: "slow calls also count as failures" }
      min_requests:         { type: int,    default: 20 }
      window_s:             { type: number, default: 10 }
      open_duration_s:      { type: number, default: 30 }
      half_open_probes:     { type: int,    default: 5 }
      fallback:             { type: enum, values: [error, default_value, cache], default: error }

    connection_pool:          # only for database / cache targets: one pool per caller instance
      size_per_instance:    { type: int,    default: 10 }
      acquire_timeout_ms:   { type: number, default: 1000 }

# ---------------------------------------------------------------------
# 3. Components
# ---------------------------------------------------------------------
components:

  # ===================================================================
  # 0. Traffic source (client)
  # ===================================================================
  traffic_source:
    primitives: [RateLimiter(as the arrival process generator), Router]
    fields:
      model:            { type: enum, values: [open, closed], default: open,
                          desc: "open: arrivals at a rate (internet traffic); closed: fixed users + think time (load tests / batch)" }
      # --- open model ---
      arrival:          { type: enum, values: [poisson, deterministic, mmpp], default: poisson }
      base_rps:         { type: number, default: 100 }
      pattern:
        type:           { type: enum, values: [constant, step, ramp, diurnal, burst], default: constant }
        # step:    [{ at_s, rps }]
        # ramp:    { from_rps, to_rps, duration_s }
        # diurnal: { peak_rps, trough_rps, period_s }
        # burst:   { every_s, multiplier, duration_s }
        params:         { type: object }
      mmpp:             { desc: "MMPP bursts: several states, each with its own rate and dwell time", states: [ { rps: number, mean_dwell_s: number } ] }
      # --- closed model ---
      users:            { type: int, default: 100 }
      think_time:       { type: Distribution, default: { dist: exponential, mean_ms: 1000 } }
      # --- request mix ---
      request_mix:      { type: list, desc: "weights across entry endpoints",
                          default: [ { endpoint: "GET /api", weight: 1.0 } ] }
      target:           { type: ref, required: true, desc: "usually the api_gateway" }
      # --- client behavior ---
      client_timeout_ms: { type: number, default: 5000 }
      client_retry:     { $ref: edge.retry, desc: "user / SDK retries, one of the sources of retry storms" }
    failures:
      - surge:          { params: { multiplier: 5 }, desc: "traffic jumps N times" }
      - retry_storm:    { params: { max_attempts: 5 }, desc: "client retries temporarily raised" }
    calibrate:
      base_rps: "sum(rate(http_requests_total{job='gateway'}[5m]))"

  # ===================================================================
  # 1. API Gateway
  # ===================================================================
  api_gateway:
    primitives: [ServerPool, RateLimiter, Router, Delay]
    fields:
      pool:             { $ref: types.InstancePool,
                          default: { instances: 2, workers_per_instance: 1000, queue_capacity: 500, cpu_cores: 2 } }
      base_latency:     { type: Distribution, default: { dist: lognormal, median_ms: 1, p99_ms: 5 } }
      plugins:          # run in order; each plugin is local overhead or a call to an external service
        type: list
        item:
          name:         { type: string, example: "jwt-auth" }
          kind:         { type: enum, values: [local, external] }
          latency:      { type: Distribution, desc: "overhead when kind=local" }
          call:         { type: ref, desc: "service called when kind=external (creates an edge)" }
          on_failure:   { type: enum, values: [reject, allow], default: reject, desc: "fail-closed / fail-open" }
        default:
          - { name: jwt-auth, kind: local, latency: { dist: lognormal, median_ms: 0.3, p99_ms: 2 } }
      routes:
        type: list
        item:
          match:        { type: string, example: "GET /orders/*" }
          target:       { type: ref, desc: "downstream LB or service" }
          weight:       { type: number, default: 1.0, desc: "canary: several targets with the same match split by weight" }
      rate_limit:
        enabled:        { type: bool, default: false }
        scope:          { type: enum, values: [global, per_route], default: global }
        rate_rps:       { type: number, default: 1000 }
        burst:          { type: int, default: 200 }
        on_exceed:      { type: enum, values: [reject_429, queue], default: reject_429 }
      autoscale:        { $ref: types.Autoscale }
    failures:
      - instance_down:  { params: { count: 1 } }
      - plugin_slow:    { params: { plugin: string, multiplier: 10 } }
    calibrate:
      base_latency: "otel: span.name='gateway' self_time"

  # ===================================================================
  # 2. Load Balancer
  # ===================================================================
  load_balancer:
    primitives: [Router, Delay, StateMachine(health checks)]
    fields:
      layer:            { type: enum, values: [L4, L7], default: L7 }
      algorithm:        { type: enum, values: [round_robin, random, least_conn, p2c, consistent_hash], default: round_robin,
                          desc: "p2c = power of two choices; the most robust against slow nodes" }
      added_latency:    { type: Distribution,
                          default: { dist: lognormal, median_ms: 0.3, p99_ms: 2 }, desc: "for L4 a constant 0.05 is fine" }
      max_connections:  { type: int, default: null, desc: "the LB's own connection limit; null means unlimited" }
      health_check:
        enabled:        { type: bool, default: true }
        interval_s:     { type: number, default: 10 }
        unhealthy_threshold: { type: int, default: 3, desc: "consecutive failures before removal, so a failed instance lives at most interval × threshold seconds" }
        healthy_threshold:   { type: int, default: 2 }
        check_type:     { type: enum, values: [liveness, latency], default: liveness,
                          desc: "liveness checks only that it is up; latency also removes slow instances (closer to outlier detection)" }
      target:           { type: ref, required: true, desc: "a service (split across its instances)" }
    failures:
      - uneven_weight:  { params: { skew: 0.5 }, desc: "uneven load: some instances take more traffic" }
    note: "An LB is rarely the bottleneck itself; its value is showing how the algorithm and health checks affect tail latency and failure recovery"

  # ===================================================================
  # 3. Stateless service
  # ===================================================================
  service:
    primitives: [ServerPool, Delay, StateMachine(autoscaling)]
    fields:
      pool:             { $ref: types.InstancePool }
      handlers:         # each endpoint's handler = local compute + a set of downstream calls (defined by edges)
        type: list
        item:
          endpoint:     { type: string, default: "*" }
          weight:       { type: number, default: 1.0 }
          service_time: { type: Distribution, default: { dist: lognormal, median_ms: 10, p99_ms: 60 },
                          desc: "local processing time (excluding downstream calls)" }
          hold_worker_during_calls: { type: bool, default: true,
                          desc: "blocking model: the worker stays busy while calling downstream (how thread-pool exhaustion propagates upward); false = async / non-blocking" }
          error_rate:   { type: number, default: 0.0, desc: "own business error rate" }
      gc:
        enabled:        { type: bool, default: false }
        interval_s:     { type: number, default: 30 }
        pause:          { type: Distribution, default: { dist: lognormal, median_ms: 20, p99_ms: 200 } }
      autoscale:        { $ref: types.Autoscale }
    failures:
      - slow:           { params: { multiplier: 5 }, desc: "service_time multiplied by N (degraded dependency, code regression)" }
      - instance_down:  { params: { count: 1 } }
      - error_spike:    { params: { error_rate: 0.3 } }
      - memory_leak:    { params: { slowdown_per_min: 0.05 }, desc: "gets slower over time until restarted" }
    calibrate:
      service_time: "otel: span self_time histogram → empirical"
      pool.instances: "kube_deployment_status_replicas"
    derived_metrics:   # computed by the analytical layer and shown live in the UI
      utilization: "ρ = λ·E[S] / (instances × workers)"
      cpu_util:    "λ·E[S]·cpu_fraction / (instances × cpu_cores)"
      queue_wait:  "Allen-Cunneen: W_q ≈ ErlangC(c, λ/μ) / (cμ − λ) × (Ca² + Cs²)/2"

  # ===================================================================
  # 4. Cache (generic cache layer; preset: redis, CDN later)
  # ===================================================================
  cache:
    primitives: [Router(hit/miss), ServerPool, Delay]
    presets:
      redis-standalone: { shards: 1, workers_per_shard: 1, max_ops_per_shard: 80000 }
      redis-cluster:    { shards: 6, workers_per_shard: 1, max_ops_per_shard: 80000 }
    fields:
      preset:           { type: enum, values: [redis-standalone, redis-cluster], default: redis-cluster }
      shards:           { type: int, default: 6 }
      workers_per_shard: { type: int, default: 1, desc: "Redis executes commands on a single thread" }
      op_latency:       { type: Distribution, default: { dist: lognormal, median_ms: 0.2, p99_ms: 1.5 },
                          desc: "server-side processing time; network latency lives on the edge" }
      hit_ratio:        { type: number, default: 0.9 }
      hot_key_share:    { type: number, default: 0.0, desc: "share of traffic landing on a single hot shard (data skew)" }
      on_miss:          { type: ref, desc: "origin fetched on a miss, usually a database" }
      miss_policy:
        populate:       { type: bool, default: true, desc: "cache-aside: write back after the origin fetch (one extra write)" }
        single_flight:  { type: bool, default: false, desc: "concurrent misses on the same key fetch the origin only once (prevents stampedes)" }
      max_connections:  { type: int, default: 10000 }
    failures:
      - flush:          { params: { hit_ratio: 0.0 }, recovery: linear, recovery_s: 300,
                          desc: "cache flush / avalanche; the hit ratio recovers gradually" }
      - shard_down:     { params: { count: 1 }, desc: "every key on that shard misses or errors" }
      - hot_key:        { params: { hot_key_share: 0.4 } }
    calibrate:
      hit_ratio: "rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))"
    derived_metrics:
      origin_rps: "λ × (1 − hit_ratio) × calls_per_request"

  # ===================================================================
  # 5. Database (Postgres / MySQL)
  # ===================================================================
  database:
    primitives: [ResourcePool, ServerPool, Router(read/write split), StateMachine(failover)]
    fields:
      engine:           { type: enum, values: [postgres, mysql], default: postgres }
      primary:
        cpu_cores:      { type: number, default: 8 }
        max_connections: { type: int, default: 200, desc: "server connection limit; errors when the callers' pools add up to more" }
        active_workers: { type: int, default: null, desc: "actual parallel executions; null means cpu_cores × 2" }
      replicas:         { type: int, default: 0 }
      replica_lag_ms:   { type: Distribution, default: { dist: lognormal, median_ms: 50, p99_ms: 500 } }
      read_routing:     { type: enum, values: [primary_only, replicas, mixed], default: primary_only }
      query_classes:
        type: list
        item:
          name:         { type: string }
          kind:         { type: enum, values: [read, write] }
          weight:       { type: number }
          service_time: { type: Distribution }
        default:
          - { name: point_read,  kind: read,  weight: 0.7,  service_time: { dist: lognormal, median_ms: 1,  p99_ms: 8 } }
          - { name: range_read,  kind: read,  weight: 0.15, service_time: { dist: lognormal, median_ms: 15, p99_ms: 120 } }
          - { name: write,       kind: write, weight: 0.15, service_time: { dist: lognormal, median_ms: 3,  p99_ms: 25 } }
      scalability:      # USL: higher concurrency makes each query slower (locks, buffer pool, context switches)
        alpha:          { type: number, default: 0.03, desc: "contention coefficient (serial part)" }
        beta:           { type: number, default: 0.0005, desc: "coherency coefficient; when > 0, throughput peaks and then falls" }
        formula:        "C(N) = N / (1 + α(N−1) + βN(N−1)); effective service time = S × N / C(N)"
    failures:
      - failover:       { params: { unavailable_s: 30 }, desc: "all writes fail while the primary fails over" }
      - slow_query:     { params: { query_class: string, multiplier: 20 } }
      - lock_contention: { params: { alpha: 0.2 } }
      - replica_lag:    { params: { median_ms: 5000 } }
    calibrate:
      query_classes: "pg_stat_statements: mean_exec_time / calls"
      primary.max_connections: "pg_settings max_connections"
    derived_metrics:
      conn_demand: "Σ(caller instances × connection_pool.size_per_instance); warn when above max_connections"
      peak_concurrency: "N* = sqrt((1 − α) / β)"

  # ===================================================================
  # 6. Message queue (Kafka)
  # ===================================================================
  message_queue:
    primitives: [Buffer, Delay, StateMachine(rebalance)]
    fields:
      engine:           { type: enum, values: [kafka], default: kafka }
      partitions:       { type: int, default: 12 }
      produce_latency:  { type: Distribution, default: { dist: lognormal, median_ms: 3, p99_ms: 20 },
                          desc: "higher with acks=all" }
      broker_max_mps:   { type: number, default: 100000, desc: "cluster-wide write limit" }
      retention_messages: { type: int, default: null, desc: "messages are dropped once the backlog exceeds this; null means unlimited" }
      consumer_groups:
        type: list
        item:
          name:         { type: string }
          consumer:     { type: ref, desc: "consumer service; each message runs through its handler" }
          consumers:    { type: int, default: 6, desc: "effective parallelism = min(consumers, partitions)" }
          batch_size:   { type: int, default: 1 }
          poll_interval_ms: { type: number, default: 100 }
          rebalance_pause_s: { type: number, default: 10, desc: "the whole group stops consuming when the consumer count changes" }
          max_processing_ms: { type: number, default: 300000,
                          desc: "exceeding it kicks the consumer out and triggers a rebalance (max.poll.interval.ms)" }
          on_failure:   { type: enum, values: [retry_inline, dead_letter, skip], default: retry_inline }
    failures:
      - consumer_crash: { params: { count: 2 } }
      - rebalance_storm: { params: { every_s: 30 } }
      - broker_slow:    { params: { multiplier: 5 } }
    calibrate:
      consumer_lag: "kafka_consumergroup_lag"
    derived_metrics:
      consume_capacity_mps: "min(consumers, partitions) × batch_size / E[processing time]"
      lag_growth_mps: "λ_in − consume_capacity_mps; when > 0 the backlog grows linearly"
      time_to_drain_s: "lag / (consume_capacity_mps − λ_in)"

# ---------------------------------------------------------------------
# 4. Metrics every component emits (the engine produces them each sampling period)
# ---------------------------------------------------------------------
metrics:
  sample_interval_s: 1
  per_component:
    - throughput_rps          # completions
    - goodput_rps             # successes returned before the client timeout
    - arrival_rps             # arrivals including retries; compared with incoming traffic it gives the amplification factor
    - utilization             # worker occupancy
    - cpu_utilization
    - queue_length
    - in_flight
    - latency: [p50, p90, p99, p999, mean]
    - errors_by_cause: [timeout, rejected_queue_full, rejected_rate_limit, circuit_open, pool_acquire_timeout, upstream_5xx, business_error]
    - instances               # changes with autoscaling
  per_edge:
    - calls_rps
    - retries_rps
    - circuit_state           # closed / open / half_open
    - pool_wait_ms: [p50, p99]
  system:
    - end_to_end_latency: [p50, p99]
    - availability            # 1 − failed requests / total requests
    - slo_burn_rate           # error rate / (1 − SLO)
    - retry_amplification     # system-wide arrivals / incoming traffic

# ---------------------------------------------------------------------
# 5. Example topology (also the engine's first end-to-end test case)
# ---------------------------------------------------------------------
example_topology:
  name: "E-commerce checkout - reference architecture"
  slo: { availability: 0.999, latency_p99_ms: 500 }
  nodes:
    - { id: client,   type: traffic_source, target: gw, base_rps: 500, client_timeout_ms: 3000,
        client_retry: { max_attempts: 3 } }
    - { id: gw,       type: api_gateway,
        routes: [ { match: "/orders/*", target: lb-order }, { match: "/products/*", target: lb-product } ] }
    - { id: lb-order,   type: load_balancer, target: order-svc,   algorithm: p2c }
    - { id: lb-product, type: load_balancer, target: product-svc, algorithm: round_robin }
    - { id: order-svc,   type: service, pool: { instances: 4, workers_per_instance: 50 } }
    - { id: product-svc, type: service, pool: { instances: 3, workers_per_instance: 100 } }
    - { id: redis,    type: cache, preset: redis-cluster, hit_ratio: 0.92, on_miss: pg }
    - { id: pg,       type: database, primary: { max_connections: 200 } }
    - { id: kafka,    type: message_queue, partitions: 12,
        consumer_groups: [ { name: fulfillment, consumer: fulfill-svc, consumers: 6 } ] }
    - { id: fulfill-svc, type: service, pool: { instances: 6 } }
  edges:
    - { from: product-svc, to: redis, timeout_ms: 50,  connection_pool: { size_per_instance: 20 } }
    - { from: order-svc,   to: pg,    timeout_ms: 500, retry: { max_attempts: 3 },
        connection_pool: { size_per_instance: 20 } }
    - { from: order-svc,   to: product-svc, timeout_ms: 300, retry: { max_attempts: 2 },
        circuit_breaker: { enabled: true } }
    - { from: order-svc,   to: kafka, mode: async }
    - { from: fulfill-svc, to: pg,    connection_pool: { size_per_instance: 10 } }
  scenarios:   # preset demo scenarios
    - { name: "Cache avalanche",  inject: { node: redis, type: flush, at_s: 60, duration_s: 10 } }
    - { name: "Slow DB exhausts thread pools", inject: { node: pg, type: slow_query, at_s: 60, params: { query_class: write, multiplier: 20 } } }
    - { name: "Retry storm",  inject: { node: product-svc, type: slow, at_s: 60, duration_s: 30, params: { multiplier: 8 } } }
    - { name: "Consumer backlog",  inject: { node: client, type: surge, at_s: 60, duration_s: 120, params: { multiplier: 3 } } }
